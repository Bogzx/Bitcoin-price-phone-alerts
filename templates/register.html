{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
  <h1>Register</h1>
  <form method="post" action="{{ url_for('register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" name="username" class="form-control" id="username" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" name="email" class="form-control" id="email" required>
    </div>
    <div class="mb-3">
      <label for="phone_number" class="form-label">Phone Number</label>
      <input type="tel" name="phone_number" class="form-control" id="phone_number"
             placeholder="+14155550123" pattern="\+[1-9][0-9]{7,14}" required>
      <div class="form-text">
        International format only (E.164), e.g. <code>+14155550123</code>. This number is
        <strong>not</strong> verified &mdash; alerts call whatever is entered here.
      </div>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" name="password" class="form-control" id="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
  <p class="mt-3">Already have an account? <a href="{{ url_for('login') }}">Login here</a>.</p>
{% endblock %}
